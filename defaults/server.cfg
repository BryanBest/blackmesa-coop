// Black Mesa SourceCoop server config.
// Created once by the container; edit freely. Recommended values from
// https://github.com/ampreeT/SourceCoop/wiki/Server-running-tips

mp_teamplay 1                              // Teamplay: noblock + friendly team display (SourceCoop handles teams)
mp_friendlyfire 0                          // Set to 1 to allow hurting teammates
mp_fraglimit 0                             // No score-based match end
mp_timelimit 0                             // No map time limit
mp_forcerespawn 1
mp_mapcycle_empty_timeout_seconds 0        // Stay on the current map while empty (keeps campaign progress)
sv_always_run 0                            // 0 = sprinting enabled
sv_alltalk 1
sv_cheats 0
sv_tags "custom, coop, sourcecoop"

// Uncomment to return to the first map after the campaign ends,
// instead of using the mapcycle's next map.
//sourcecoop_homemap "bm_c0a0a"

// Keep this line LAST: applies hostname / passwords from the container settings.
exec docker.cfg
